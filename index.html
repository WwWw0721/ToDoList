<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>共用記事本</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background-color: #f3f5f7;
            color: #333;
        }

        .container {
            width: 92%;
            max-width: 700px;
            margin: 30px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .status {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #aaa;
            margin-right: 5px;
        }

        .dot.online {
            background-color: #4caf50;
        }

        .add-box {
            background-color: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #4caf50;
        }

        button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .add-btn {
            width: 100%;
            padding: 13px;
            background-color: #4caf50;
            color: white;
            font-weight: bold;
        }

        .add-btn:hover {
            background-color: #43a047;
        }

        .add-btn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        .task {
            background-color: white;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.07);
        }

        .task.today {
            border-left: 6px solid #ff9800;
        }

        .task.past {
            border-left: 6px solid #e74c3c;
        }

        .task.future {
            border-left: 6px solid #4caf50;
        }

        .task.done {
            opacity: 0.55;
        }

        .task.done .task-text {
            text-decoration: line-through;
        }

        .task-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .task-checkbox {
            width: 21px;
            height: 21px;
            flex-shrink: 0;
        }

        .task-text {
            flex: 1;
            font-size: 18px;
            font-weight: bold;
            word-break: break-word;
        }

        .task-info {
            margin-top: 12px;
            font-size: 14px;
            color: #666;
        }

        .task-bottom {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .task-bottom select {
            flex: 1;
        }

        .delete-btn {
            background-color: #e74c3c;
            color: white;
            padding: 0 18px;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        .empty {
            text-align: center;
            background-color: white;
            padding: 35px 10px;
            border-radius: 12px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 500px) {

            .container {
                margin-top: 18px;
            }

            h1 {
                font-size: 26px;
            }

            .task-bottom {
                flex-direction: column;
            }

            .delete-btn {
                padding: 11px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>📝 共用記事本</h1>

    <div class="status">

        <span id="dot" class="dot"></span>

        <span id="statusText">
            正在連接雲端...
        </span>

    </div>


    <div class="add-box">

        <div class="input-group">

            <label>
                要做的事情
            </label>

            <input
                type="text"
                id="taskInput"
                placeholder="例如：寫演算法作業"
            >

        </div>


        <div class="input-group">

            <label>
                日期
            </label>

            <input
                type="date"
                id="dateInput"
            >

        </div>


        <div class="input-group">

            <label>
                時間
            </label>

            <select id="timeTypeInput">

                <option value="之前">
                    之前
                </option>

                <option value="當天">
                    當天
                </option>

            </select>

        </div>


        <button
            id="addButton"
            class="add-btn"
            disabled
        >
            ＋ 新增事項
        </button>

    </div>


    <h2>
        待辦事項
    </h2>


    <div id="taskList">

        <div class="loading">
            正在讀取雲端資料...
        </div>

    </div>

</div>


<script type="module">

    // =========================================
    // Firebase
    // =========================================

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        signInAnonymously
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
        getFirestore,
        collection,
        addDoc,
        onSnapshot,
        doc,
        updateDoc,
        deleteDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



    // =========================================
    // 你的 Firebase 設定
    // =========================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyA-tW_jIFmabdCfM_tUxV2X1zoyDeNxVUw",

        authDomain:
            "todolist-b6b25.firebaseapp.com",

        projectId:
            "todolist-b6b25",

        storageBucket:
            "todolist-b6b25.firebasestorage.app",

        messagingSenderId:
            "1031711368625",

        appId:
            "1:1031711368625:web:c1024650865e8b1ca7c990",

        measurementId:
            "G-546B3SRGNG"

    };



    // =========================================
    // 啟動 Firebase
    // =========================================

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    const tasksCollection =
        collection(
            db,
            "tasks"
        );



    // =========================================
    // HTML 元素
    // =========================================

    const taskInput =
        document.getElementById(
            "taskInput"
        );


    const dateInput =
        document.getElementById(
            "dateInput"
        );


    const timeTypeInput =
        document.getElementById(
            "timeTypeInput"
        );


    const addButton =
        document.getElementById(
            "addButton"
        );


    const taskList =
        document.getElementById(
            "taskList"
        );


    const statusText =
        document.getElementById(
            "statusText"
        );


    const dot =
        document.getElementById(
            "dot"
        );


    let tasks = [];



    // =========================================
    // 匿名登入
    // =========================================

    async function login() {

        try {

            await signInAnonymously(auth);


            statusText.textContent =
                "雲端已連線";


            dot.classList.add(
                "online"
            );


            addButton.disabled =
                false;


            listenTasks();

        }

        catch (error) {

            console.error(error);


            statusText.textContent =
                "Firebase 連線失敗";


            alert(
                "Firebase 登入失敗！請確認 Authentication 匿名登入是否已開啟。"
            );

        }

    }



    // =========================================
    // 即時讀取記事
    // =========================================

    function listenTasks() {

        onSnapshot(

            tasksCollection,

            function(snapshot) {

                tasks = [];


                snapshot.forEach(
                    function(item) {

                        tasks.push({

                            id: item.id,

                            ...item.data()

                        });

                    }
                );


                // 日期排序

                tasks.sort(
                    function(a, b) {

                        if (
                            a.date === b.date
                        ) {

                            return 0;

                        }


                        if (
                            a.date < b.date
                        ) {

                            return -1;

                        }


                        return 1;

                    }
                );


                showTasks();

            },

            function(error) {

                console.error(error);


                statusText.textContent =
                    "資料同步失敗";


                alert(
                    "Firestore 無法讀取資料，請確認 Rules 是否設定正確。"
                );

            }

        );

    }



    // =========================================
    // 新增記事
    // =========================================

    async function addTask() {

        const text =
            taskInput.value.trim();


        const date =
            dateInput.value;


        const timeType =
            timeTypeInput.value;



        if (
            text === ""
        ) {

            alert(
                "請輸入要做的事情！"
            );

            return;

        }


        if (
            date === ""
        ) {

            alert(
                "請選擇日期！"
            );

            return;

        }



        try {

            addButton.disabled =
                true;


            addButton.textContent =
                "新增中...";


            await addDoc(

                tasksCollection,

                {

                    text:
                        text,

                    date:
                        date,

                    timeType:
                        timeType,

                    done:
                        false,

                    createdAt:
                        serverTimestamp()

                }

            );


            taskInput.value =
                "";


            taskInput.focus();

        }

        catch (error) {

            console.error(error);


            alert(
                "新增失敗！"
            );

        }

        finally {

            addButton.disabled =
                false;


            addButton.textContent =
                "＋ 新增事項";

        }

    }



    // =========================================
    // 顯示記事
    // =========================================

    function showTasks() {

        taskList.innerHTML =
            "";


        if (
            tasks.length === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "empty";


            empty.textContent =
                "目前沒有記事 📭";


            taskList.appendChild(
                empty
            );


            return;

        }



        tasks.forEach(
            function(task) {

                const box =
                    document.createElement(
                        "div"
                    );


                box.className =
                    "task";


                const today =
                    getToday();



                // 日期顏色

                if (
                    task.date === today
                ) {

                    box.classList.add(
                        "today"
                    );

                }

                else if (
                    task.date < today
                ) {

                    box.classList.add(
                        "past"
                    );

                }

                else {

                    box.classList.add(
                        "future"
                    );

                }



                // 已完成

                if (
                    task.done === true
                ) {

                    box.classList.add(
                        "done"
                    );

                }



                // =================================
                // 上半部
                // =================================

                const top =
                    document.createElement(
                        "div"
                    );


                top.className =
                    "task-top";



                const checkbox =
                    document.createElement(
                        "input"
                    );


                checkbox.type =
                    "checkbox";


                checkbox.className =
                    "task-checkbox";


                checkbox.checked =
                    task.done === true;



                checkbox.addEventListener(

                    "change",

                    function() {

                        changeDone(

                            task.id,

                            checkbox.checked

                        );

                    }

                );



                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "task-text";


                text.textContent =
                    task.text;



                top.appendChild(
                    checkbox
                );


                top.appendChild(
                    text
                );



                // =================================
                // 日期資訊
                // =================================

                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "task-info";


                info.textContent =
                    "📅 日期：" +
                    formatDate(
                        task.date
                    );



                // =================================
                // 下半部
                // =================================

                const bottom =
                    document.createElement(
                        "div"
                    );


                bottom.className =
                    "task-bottom";



                const select =
                    document.createElement(
                        "select"
                    );


                const option1 =
                    document.createElement(
                        "option"
                    );


                option1.value =
                    "之前";


                option1.textContent =
                    "之前";



                const option2 =
                    document.createElement(
                        "option"
                    );


                option2.value =
                    "當天";


                option2.textContent =
                    "當天";



                select.appendChild(
                    option1
                );


                select.appendChild(
                    option2
                );


                select.value =
                    task.timeType;



                select.addEventListener(

                    "change",

                    function() {

                        changeTimeType(

                            task.id,

                            select.value

                        );

                    }

                );



                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "delete-btn";


                deleteButton.textContent =
                    "刪除";



                deleteButton.addEventListener(

                    "click",

                    function() {

                        removeTask(
                            task.id
                        );

                    }

                );



                bottom.appendChild(
                    select
                );


                bottom.appendChild(
                    deleteButton
                );



                box.appendChild(
                    top
                );


                box.appendChild(
                    info
                );


                box.appendChild(
                    bottom
                );


                taskList.appendChild(
                    box
                );

            }
        );

    }



    // =========================================
    // 完成 / 未完成
    // =========================================

    async function changeDone(
        id,
        value
    ) {

        try {

            const taskRef =
                doc(
                    db,
                    "tasks",
                    id
                );


            await updateDoc(

                taskRef,

                {

                    done:
                        value

                }

            );

        }

        catch (error) {

            console.error(error);


            alert(
                "更新失敗！"
            );

        }

    }



    // =========================================
    // 修改 之前 / 當天
    // =========================================

    async function changeTimeType(
        id,
        value
    ) {

        try {

            const taskRef =
                doc(
                    db,
                    "tasks",
                    id
                );


            await updateDoc(

                taskRef,

                {

                    timeType:
                        value

                }

            );

        }

        catch (error) {

            console.error(error);


            alert(
                "更新失敗！"
            );

        }

    }



    // =========================================
    // 刪除
    // =========================================

    async function removeTask(
        id
    ) {

        const result =
            confirm(
                "確定要刪除這筆記事嗎？"
            );


        if (
            result === false
        ) {

            return;

        }


        try {

            const taskRef =
                doc(
                    db,
                    "tasks",
                    id
                );


            await deleteDoc(
                taskRef
            );

        }

        catch (error) {

            console.error(error);


            alert(
                "刪除失敗！"
            );

        }

    }



    // =========================================
    // 今天日期
    // =========================================

    function getToday() {

        const now =
            new Date();


        const year =
            now.getFullYear();


        const month =
            String(
                now.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const day =
            String(
                now.getDate()
            ).padStart(
                2,
                "0"
            );


        return (
            year +
            "-" +
            month +
            "-" +
            day
        );

    }



    // =========================================
    // 日期顯示
    // =========================================

    function formatDate(
        date
    ) {

        if (
            !date
        ) {

            return "";

        }


        const parts =
            date.split(
                "-"
            );


        return (
            parts[0] +
            "年" +
            parts[1] +
            "月" +
            parts[2] +
            "日"
        );

    }



    // =========================================
    // Enter 新增
    // =========================================

    taskInput.addEventListener(

        "keydown",

        function(event) {

            if (
                event.key === "Enter"
            ) {

                addTask();

            }

        }

    );



    addButton.addEventListener(

        "click",

        addTask

    );



    // =========================================
    // 啟動網站
    // =========================================

    login();

</script>

</body>
</html>
