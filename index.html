<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>共用記事本</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft JhengHei",
                Arial,
                sans-serif;

            background: #f4f5f7;
            color: #222;

            padding-bottom:
                env(safe-area-inset-bottom);
        }


        /* =========================
           最外層
        ========================= */

        .container {
            width: calc(100% - 24px);
            max-width: 720px;

            margin: 0 auto;

            padding-top: 20px;
            padding-bottom: 40px;
        }


        /* =========================
           標題
        ========================= */

        h1 {
            text-align: center;

            margin:
                5px 0 8px;

            font-size: 28px;
        }


        .status {
            text-align: center;

            margin-bottom: 20px;

            font-size: 14px;

            color: #777;
        }


        .dot {
            display: inline-block;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #aaa;

            margin-right: 5px;
        }


        .dot.online {
            background: #35a853;
        }


        /* =========================
           新增區塊
        ========================= */

        .add-box {
            background: white;

            border-radius: 16px;

            padding: 18px;

            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.07);

            margin-bottom: 26px;
        }


        .input-group {
            margin-bottom: 17px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            font-size: 15px;
        }


        input,
        select {
            display: block;

            width: 100%;

            min-height: 48px;

            padding:
                10px 12px;

            font-size: 16px;

            border:
                1px solid #d5d5d5;

            border-radius: 10px;

            background: white;

            color: #222;
        }


        input:focus,
        select:focus {
            outline: none;

            border-color: #4caf50;

            box-shadow:
                0 0 0 3px
                rgba(76, 175, 80, 0.12);
        }


        button {
            font-family: inherit;

            border: none;

            cursor: pointer;

            touch-action:
                manipulation;
        }


        .add-btn {
            width: 100%;

            min-height: 50px;

            border-radius: 11px;

            background: #4caf50;

            color: white;

            font-size: 17px;

            font-weight: bold;
        }


        .add-btn:active {
            transform:
                scale(0.99);
        }


        .add-btn:disabled {
            background: #aaa;
        }


        /* =========================
           待辦標題
        ========================= */

        .list-title {
            display: flex;

            align-items: center;

            justify-content:
                space-between;

            margin-bottom: 12px;
        }


        .list-title h2 {
            margin: 0;

            font-size: 21px;
        }


        /* =========================
           每一筆記事
        ========================= */

        .task {
            width: 100%;

            background: white;

            padding: 16px;

            border-radius: 14px;

            margin-bottom: 12px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.06);

            overflow: hidden;
        }


        .task.today {
            border-left:
                6px solid #ff9800;
        }


        .task.past {
            border-left:
                6px solid #e74c3c;
        }


        .task.future {
            border-left:
                6px solid #4caf50;
        }


        .task.done {
            opacity: 0.55;
        }


        .task.done .task-text {
            text-decoration:
                line-through;
        }


        /* =========================
           第一排
        ========================= */

        .task-top {
            display: flex;

            align-items:
                flex-start;

            gap: 12px;
        }


        .task-checkbox {
            appearance: auto;

            width: 23px;
            height: 23px;

            min-width: 23px;
            min-height: 23px;

            margin-top: 1px;
        }


        .task-text {
            flex: 1;

            min-width: 0;

            font-size: 18px;

            font-weight: 600;

            line-height: 1.5;

            overflow-wrap:
                anywhere;

            word-break:
                break-word;
        }


        /* =========================
           日期
        ========================= */

        .task-info {
            margin-top: 12px;

            padding-left: 35px;

            font-size: 14px;

            color: #666;
        }


        /* =========================
           下方操作
        ========================= */

        .task-bottom {
            display: flex;

            gap: 10px;

            margin-top: 15px;
        }


        .task-bottom select {
            flex: 1;
        }


        .delete-btn {
            min-height: 48px;

            padding:
                0 22px;

            border-radius: 10px;

            background: #e74c3c;

            color: white;

            font-size: 16px;

            font-weight: 600;
        }


        /* =========================
           空白 / 載入
        ========================= */

        .empty,
        .loading {
            width: 100%;

            text-align: center;

            background: white;

            padding:
                35px 15px;

            border-radius: 14px;

            color: #999;
        }


        /* =========================
           手機版
        ========================= */

        @media
        (max-width: 599px) {

            .container {
                width:
                    calc(100% - 20px);

                padding-top:
                    12px;
            }


            h1 {
                font-size: 25px;

                margin-top: 5px;
            }


            .add-box {
                padding: 16px;

                border-radius: 14px;
            }


            .task {
                padding: 15px;
            }


            .task-text {
                font-size: 17px;
            }


            .task-info {
                padding-left: 34px;
            }


            .task-bottom {
                flex-direction:
                    column;
            }


            .task-bottom select {
                width: 100%;
            }


            .delete-btn {
                width: 100%;

                min-height: 48px;
            }

        }


        /* =========================
           電腦 / 平板
        ========================= */

        @media
        (min-width: 600px) {

            .container {
                padding-top: 30px;
            }


            .add-box {
                padding: 22px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        📝 共用記事本
    </h1>


    <div class="status">

        <span
            id="dot"
            class="dot"
        ></span>

        <span id="statusText">
            正在連接雲端...
        </span>

    </div>


    <div class="add-box">

        <div class="input-group">

            <label for="taskInput">
                要做的事情
            </label>

            <input
                type="text"
                id="taskInput"
                placeholder="例如：寫演算法作業"
            >

        </div>


        <div class="input-group">

            <label for="dateInput">
                日期
            </label>

            <input
                type="date"
                id="dateInput"
            >

        </div>


        <div class="input-group">

            <label for="timeTypeInput">
                時間
            </label>

            <select id="timeTypeInput">

                <option value="之前">
                    之前
                </option>

                <option value="當天">
                    當天
                </option>

            </select>

        </div>


        <button
            id="addButton"
            class="add-btn"
            disabled
        >
            ＋ 新增事項
        </button>

    </div>


    <div class="list-title">

        <h2>
            待辦事項
        </h2>

    </div>


    <div id="taskList">

        <div class="loading">
            正在讀取雲端資料...
        </div>

    </div>

</div>


<script type="module">

    import {
        initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        signInAnonymously
    }
    from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
        getFirestore,
        collection,
        addDoc,
        onSnapshot,
        doc,
        updateDoc,
        deleteDoc,
        serverTimestamp
    }
    from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



    /* =========================
       Firebase 設定
    ========================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyA-tW_jIFmabdCfM_tUxV2X1zoyDeNxVUw",

        authDomain:
            "todolist-b6b25.firebaseapp.com",

        projectId:
            "todolist-b6b25",

        storageBucket:
            "todolist-b6b25.firebasestorage.app",

        messagingSenderId:
            "1031711368625",

        appId:
            "1:1031711368625:web:c1024650865e8b1ca7c990",

        measurementId:
            "G-546B3SRGNG"

    };



    const app =
        initializeApp(
            firebaseConfig
        );


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    const tasksCollection =
        collection(
            db,
            "tasks"
        );



    const taskInput =
        document.getElementById(
            "taskInput"
        );


    const dateInput =
        document.getElementById(
            "dateInput"
        );


    const timeTypeInput =
        document.getElementById(
            "timeTypeInput"
        );


    const addButton =
        document.getElementById(
            "addButton"
        );


    const taskList =
        document.getElementById(
            "taskList"
        );


    const statusText =
        document.getElementById(
            "statusText"
        );


    const dot =
        document.getElementById(
            "dot"
        );


    let tasks = [];



    /* =========================
       登入 Firebase
    ========================= */

    async function login() {

        try {

            await signInAnonymously(
                auth
            );


            statusText.textContent =
                "雲端已連線";


            dot.classList.add(
                "online"
            );


            addButton.disabled =
                false;


            listenTasks();

        }

        catch (error) {

            console.error(
                error
            );


            statusText.textContent =
                "雲端連線失敗";


            alert(
                "Firebase 登入失敗！"
            );

        }

    }



    /* =========================
       即時讀取
    ========================= */

    function listenTasks() {

        onSnapshot(

            tasksCollection,

            function(snapshot) {

                tasks = [];


                snapshot.forEach(

                    function(item) {

                        tasks.push({

                            id:
                                item.id,

                            ...item.data()

                        });

                    }

                );


                tasks.sort(

                    function(a, b) {

                        if (
                            a.date ===
                            b.date
                        ) {

                            return 0;

                        }


                        return (
                            a.date <
                            b.date
                        )
                        ? -1
                        : 1;

                    }

                );


                showTasks();

            },

            function(error) {

                console.error(
                    error
                );


                statusText.textContent =
                    "同步失敗";

            }

        );

    }



    /* =========================
       新增
    ========================= */

    async function addTask() {

        const text =
            taskInput.value.trim();


        const date =
            dateInput.value;


        const timeType =
            timeTypeInput.value;



        if (
            text === ""
        ) {

            alert(
                "請輸入要做的事情！"
            );

            return;

        }


        if (
            date === ""
        ) {

            alert(
                "請選擇日期！"
            );

            return;

        }



        try {

            addButton.disabled =
                true;


            addButton.textContent =
                "新增中...";


            await addDoc(

                tasksCollection,

                {

                    text:
                        text,

                    date:
                        date,

                    timeType:
                        timeType,

                    done:
                        false,

                    createdAt:
                        serverTimestamp()

                }

            );


            taskInput.value =
                "";


            taskInput.focus();

        }

        catch (error) {

            console.error(
                error
            );


            alert(
                "新增失敗！"
            );

        }

        finally {

            addButton.disabled =
                false;


            addButton.textContent =
                "＋ 新增事項";

        }

    }



    /* =========================
       顯示
    ========================= */

    function showTasks() {

        taskList.innerHTML =
            "";


        if (
            tasks.length === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "empty";


            empty.textContent =
                "目前沒有記事 📭";


            taskList.appendChild(
                empty
            );


            return;

        }



        tasks.forEach(

            function(task) {

                const box =
                    document.createElement(
                        "div"
                    );


                box.className =
                    "task";


                const today =
                    getToday();



                if (
                    task.date ===
                    today
                ) {

                    box.classList.add(
                        "today"
                    );

                }

                else if (
                    task.date <
                    today
                ) {

                    box.classList.add(
                        "past"
                    );

                }

                else {

                    box.classList.add(
                        "future"
                    );

                }



                if (
                    task.done ===
                    true
                ) {

                    box.classList.add(
                        "done"
                    );

                }



                const top =
                    document.createElement(
                        "div"
                    );


                top.className =
                    "task-top";



                const checkbox =
                    document.createElement(
                        "input"
                    );


                checkbox.type =
                    "checkbox";


                checkbox.className =
                    "task-checkbox";


                checkbox.checked =
                    task.done === true;



                checkbox.addEventListener(

                    "change",

                    function() {

                        changeDone(

                            task.id,

                            checkbox.checked

                        );

                    }

                );



                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "task-text";


                text.textContent =
                    task.text;



                top.appendChild(
                    checkbox
                );


                top.appendChild(
                    text
                );



                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "task-info";


                info.textContent =
                    "📅 " +
                    formatDate(
                        task.date
                    );



                const bottom =
                    document.createElement(
                        "div"
                    );


                bottom.className =
                    "task-bottom";



                const select =
                    document.createElement(
                        "select"
                    );


                const beforeOption =
                    document.createElement(
                        "option"
                    );


                beforeOption.value =
                    "之前";


                beforeOption.textContent =
                    "之前";



                const todayOption =
                    document.createElement(
                        "option"
                    );


                todayOption.value =
                    "當天";


                todayOption.textContent =
                    "當天";



                select.appendChild(
                    beforeOption
                );


                select.appendChild(
                    todayOption
                );


                select.value =
                    task.timeType;



                select.addEventListener(

                    "change",

                    function() {

                        changeTimeType(

                            task.id,

                            select.value

                        );

                    }

                );



                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "delete-btn";


                deleteButton.textContent =
                    "刪除";



                deleteButton.addEventListener(

                    "click",

                    function() {

                        removeTask(
                            task.id
                        );

                    }

                );



                bottom.appendChild(
                    select
                );


                bottom.appendChild(
                    deleteButton
                );


                box.appendChild(
                    top
                );


                box.appendChild(
                    info
                );


                box.appendChild(
                    bottom
                );


                taskList.appendChild(
                    box
                );

            }

        );

    }



    /* =========================
       完成
    ========================= */

    async function changeDone(
        id,
        value
    ) {

        try {

            await updateDoc(

                doc(
                    db,
                    "tasks",
                    id
                ),

                {

                    done:
                        value

                }

            );

        }

        catch (error) {

            console.error(
                error
            );


            alert(
                "更新失敗！"
            );

        }

    }



    /* =========================
       修改之前 / 當天
    ========================= */

    async function changeTimeType(
        id,
        value
    ) {

        try {

            await updateDoc(

                doc(
                    db,
                    "tasks",
                    id
                ),

                {

                    timeType:
                        value

                }

            );

        }

        catch (error) {

            console.error(
                error
            );


            alert(
                "更新失敗！"
            );

        }

    }



    /* =========================
       刪除
    ========================= */

    async function removeTask(
        id
    ) {

        const result =
            confirm(
                "確定要刪除這筆記事嗎？"
            );


        if (
            result === false
        ) {

            return;

        }


        try {

            await deleteDoc(

                doc(
                    db,
                    "tasks",
                    id
                )

            );

        }

        catch (error) {

            console.error(
                error
            );


            alert(
                "刪除失敗！"
            );

        }

    }



    /* =========================
       今天
    ========================= */

    function getToday() {

        const now =
            new Date();


        const year =
            now.getFullYear();


        const month =
            String(
                now.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const day =
            String(
                now.getDate()
            ).padStart(
                2,
                "0"
            );


        return (
            year +
            "-" +
            month +
            "-" +
            day
        );

    }



    /* =========================
       日期格式
    ========================= */

    function formatDate(
        date
    ) {

        if (
            !date
        ) {

            return "";

        }


        const parts =
            date.split(
                "-"
            );


        return (
            parts[0] +
            "/" +
            parts[1] +
            "/" +
            parts[2]
        );

    }



    /* =========================
       按 Enter 新增
    ========================= */

    taskInput.addEventListener(

        "keydown",

        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                addTask();

            }

        }

    );


    addButton.addEventListener(
        "click",
        addTask
    );


    login();

</script>

</body>

</html>
